[package]
name = "macos-windows-manager"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mwm-core = { path = "../crates/mwm-core" }
# Штамп сборки из `build.rs` — секунды эпохи; в подпись меню он идёт временем
# локальной зоны, а её в std нет.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Конфиг теперь не только читается, но и пишется — окном настроек.
serde_yaml = "0.9"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Клавишу, нажатую поверх чужого приложения, слышит только этот плагин: окон у
# трея нет, и слушать её больше некому.
tauri-plugin-global-shortcut = "2"

# Accessibility: и перечисление окон, и (на следующем этапе) их подъём. Одно
# разрешение на оба дела, и потому один интерфейс: заголовки можно было бы
# брать через CGWindowList, но тот с macOS 10.15 требует Screen Recording —
# второе разрешение ради того же самого.
[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
accessibility-sys = "0.2"
core-foundation = "0.10"
# Версия согласована с той, что тянет сам core-foundation = "0.10" выше (обе
# 0.24 и 0.25 core-graphics требуют её же) — геометрия окон и список экранов
# в ax.rs.
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSScreen"] }
objc2-foundation = "0.3"
