# Два крейта, и разделены они не по вкусу. `mwm-core` не знает ни про macOS, ни
# про Tauri: его тесты гоняются на любой машине, и вся логика трекера живёт
# здесь. `src-tauri` — приложение, собирается только на маке. Держи логику
# внутри приложения — и проверить её было бы негде, кроме той самой машины,
# на которой она и работает.
[workspace]
resolver = "2"
members = ["crates/mwm-core", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"

# Профиль стоит здесь, а не в `src-tauri/Cargo.toml`, и это не вкусовщина:
# в workspace cargo читает `[profile.*]` только из корневого манифеста, а в
# манифесте участника молча не читает вовсе — ни ошибки, ни предупреждения.
#
# Замерено на макбуке (MacBook Air, 10 ядер), пересборка после правки одной
# строки в `src-tauri/src/main.rs`: 11,6 с без строки и 3,05 с с ней, по два
# прогона. `lto` тут не заводили и заводить не надо — у соседнего пикера
# fat-LTO стоил 208 с против 70 без него.
#
# Быстрее соседей этот проект как раз потому, что разделён на два крейта
# (см. комментарий выше): rustc типизирует крейт целиком, и правка в
# `src-tauri` не заставляет заново проходить `mwm-core`.
[profile.release]
incremental = true
