<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macos-windows-manager Settings</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 0;
    display: flex; height: 100vh;
    font: 13px -apple-system, system-ui, sans-serif;
    background: #1c1c1e; color: #e6e6e6;
  }
  /* Список вкладок слева, страница справа. Вкладка — это та же группа полей,
     что была здесь и раньше, просто показанная по одной: четырнадцать полей
     в окно разом не помещаются. */
  #tabs {
    width: 170px; flex: none; box-sizing: border-box;
    padding: 12px 0; overflow-y: auto;
    background: #242426; border-right: 1px solid #3a3a3c;
  }
  .tab { padding: 6px 14px 6px 22px; cursor: default; color: #bbb; }
  .tab.active { background: #0a84ff; color: #fff; }
  main {
    flex: 1; min-width: 0; overflow-y: auto;
    box-sizing: border-box; padding: 18px 22px 0;
  }
  /* Страницы все до одной лежат в DOM, спрятана лишь неактивная. Рисуй мы
     только открытую — `collect()` искал бы `getElementById` полей соседних
     вкладок и падал бы на `null` при первом же Save. */
  section[data-tab] { display: none; }
  section[data-tab].active { display: block; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  /* Лог прокручивается сам, а не страницей: строк в буфере тысяча, и уедь они
     страницей — вместе с ними уехал бы липкий footer с кнопкой Save. */
  #log-view {
    margin: 0; height: 380px; overflow: auto;
    box-sizing: border-box; padding: 8px;
    border: 1px solid #3a3a3c; border-radius: 4px;
    background: #2c2c2e; color: #d6d6d6;
    font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .field { margin-bottom: 10px; }
  .field label { display: block; margin-bottom: 3px; }
  .field.check label { display: inline; }
  input[type=text], input[type=password], textarea {
    width: 100%; box-sizing: border-box;
    padding: 4px 6px; border: 1px solid #3a3a3c; border-radius: 4px;
    background: #2c2c2e; color: #e6e6e6;
    font: inherit;
  }
  /* Четыре строки видно без прокрутки: терминалов у человека обычно столько,
     и поле на три строки прячет последний за скроллом собственной высоты. */
  textarea { min-height: 80px; resize: vertical; }
  .hint { color: #999; margin-top: 3px; }
  .note { color: #999; margin: 0 0 8px; }
  /* Липким footer остаётся и со вкладками: у Windows под textarea высота
     гуляет, а кнопка, уехавшая под сгиб, читается как её отсутствие. */
  footer {
    position: sticky; bottom: 0;
    margin-top: 14px; padding: 12px 0;
    background: #1c1c1e; border-top: 1px solid #3a3a3c;
  }
  #status { color: #999; margin-left: 10px; }
  #status.bad { color: #ff7b72; }
</style>
</head>
<body>
<nav id="tabs"></nav>
<main>
  <div id="form"></div>
  <footer><button id="save">Save</button><span id="status"></span></footer>
</main>
<script>
(async function () {
  const invoke = (cmd, args) => (window.__TAURI__
    ? window.__TAURI__.core.invoke(cmd, args)
    : Promise.resolve());

  // Состав формы таблицей, а не разметкой: поле добавляется строкой, и
  // сторож в main.rs проверяет по именам ключей, что ни одно не пропало.
  //
  // Блока `state:` здесь нет намеренно. Пути состояния правит тот, кто знает,
  // зачем их менять, а слияние патча по ключам сохранит их нетронутыми и без
  // редактора.
  const GROUPS = [
    { id: 'features', title: 'Features', fields: [
      ['features.placement', 'check', 'Place windows where they were',
        'When a session’s window shows up again, put it back where that session '
        + 'had it last time. Switched off, windows stay where the system opened them; '
        + 'remembered places keep being recorded, so switching it back on resumes '
        + 'placing windows that appear after that.'],
      ['features.snapshots', 'check', 'Keep layout snapshots',
        'Record which sessions were open and where, so the picker can bring a whole '
        + 'layout back (the ^S list). Switched off, no new snapshots are written and '
        + 'the ones already recorded stop being published.'],
      ['features.requests', 'check', 'Serve raise and unread requests over MQTT',
        'Let the picker ask this machine to raise a window or mark a session unread. '
        + 'Switched off, the tracker also stops announcing that it can — the picker '
        + 'offers no Enter instead of offering one that does nothing.'],
      ['features.localSource', 'check', 'Also track sessions running on this machine',
        'Read the session list from the aggregator on this machine as well as the '
        + 'remote one, and put the window file next to it, where that aggregator '
        + 'reads it. Without this, a session running here shows no window in the '
        + 'picker: its name is missing from the remote list, so there is nothing to '
        + 'match the window title against. Costs nothing on a machine that keeps no '
        + 'aggregator of its own — there is no local list to read.'],
    ]},
    { id: 'connection', title: 'Connection', fields: [
      ['sshHost', 'text', 'Machine where sessions and the aggregator live'],
      ['remoteDir', 'text', 'Directory of tracker files on that machine'],
      ['windowHost', 'text', 'Name of this machine, as the picker knows it'],
    ]},
    { id: 'windows', title: 'Windows',
      note: 'Only windows of these applications are tracked; everything else is left alone.',
      fields: [
        ['terminals', 'lines', 'Bundle ids counted as terminals, one per line'],
        ['tickMs', 'number', 'Poll interval, milliseconds'],
        ['dumpCacheMs', 'number', 'Session index cache age, milliseconds'],
        ['tileHotkey', 'text',
          'Hotkey for Tile windows, takes effect after restart. Empty means the '
          + 'built-in Cmd+Alt+Ctrl+C.'],
      ]},
    { id: 'mqtt', title: 'MQTT', note: 'Takes effect after restart.', fields: [
      ['mqtt.host', 'text', 'Broker address'],
      ['mqtt.port', 'number', 'Broker port'],
      ['mqtt.user', 'text', 'User'],
      ['mqtt.password', 'password', 'Leave empty to keep the stored one'],
      ['mqtt.base', 'text', 'Topic prefix of this machine'],
    ]},
    // Единственная вкладка без полей: она ничего не правит в config.yaml, а
    // показывает буфер лога. `collect()` проходит её вхолостую — список полей
    // пуст, — и трогать его ради неё не пришлось.
    //
    // Заведена затем, что запущенное из `.app` приложение stderr отдаёт
    // некуда, и на вопрос «почему трекер притих» смотреть было не во что.
    { id: 'log', title: 'Log', fields: [],
      note: 'What this app has written since it started. Newest at the bottom.',
      body: '<pre id="log-view"></pre>' },
  ];

  const status = document.getElementById('status');
  let file = {};
  let effective = {};

  const escape = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  const at = (root, path) => path.split('.').reduce(
    (node, key) => (node == null ? undefined : node[key]), root);

  const fieldId = (path) => `f-${path.replace(/\./g, '-')}`;

  // Показывается в поле то, что лежит в файле, — и ничего больше. Умолчание,
  // подставленное в поле, человек сохранил бы обратно как свой выбор, и файл
  // обрастал бы значениями, которых никто не выбирал.
  function shown(path, kind) {
    if (kind === 'password') return '';
    const value = at(file, path);
    if (value == null) return '';
    return kind === 'lines' ? value.join('\n') : String(value);
  }

  // Подсказка только у пустого поля: заполненное само показывает действующее
  // значение, и вторая строка под каждым полем была бы шумом. Пустое же поле
  // молчит о том, что работает вместо него, — а с этого вопроса начинается
  // разбирательство с притихшим трекером.
  function inEffect(path, kind) {
    if (kind === 'check' || kind === 'password') return '';
    if (shown(path, kind)) return '';
    const value = at(effective, path);
    if (value == null || (Array.isArray(value) && !value.length)) return '';
    return `in effect: ${Array.isArray(value) ? value.join(', ') : value}`;
  }

  // Открытая вкладка живёт снаружи `render()`: форма перерисовывается после
  // каждого удачного Save, и без этого человека выбрасывало бы на Features с
  // той самой вкладки, где он только что сохранился.
  let active = GROUPS[0].id;

  function renderTabs() {
    document.getElementById('tabs').innerHTML = GROUPS.map((group) =>
      `<div class="tab${group.id === active ? ' active' : ''}" data-tab="${group.id}"
        >${escape(group.title)}</div>`).join('');
  }

  // Опрос, а не событие Tauri: подписка потребовала бы `AppHandle` там, где
  // сейчас голый макрос `mwm_log!`, — в том числе в `mwm-core`, который про
  // Tauri не знает и знать не должен. Секунда — такт трекера; чаще незачем.
  let logTimer = null;

  async function refreshLog() {
    const view = document.getElementById('log-view');
    if (!view) return;
    const lines = await invoke('read_log') || [];
    const text = lines.length ? lines.join('\n') : 'nothing logged yet';
    // Молчаливый такт не трогает узел вовсе: перезапись того же текста сбивала
    // бы выделение под курсором раз в секунду — а лог читают, выделяя строки.
    if (text === view.textContent) return;
    // Прокрутка едет вниз, только если человек и так был внизу. Уехал он
    // читать старую строку — дёргать его под низ каждую секунду значило бы не
    // дать дочитать.
    const atBottom = view.scrollHeight - view.scrollTop - view.clientHeight < 20;
    view.textContent = text;
    if (atBottom) view.scrollTop = view.scrollHeight;
  }

  // Один обход на оба списка: `data-tab` стоит и на вкладке, и на её странице,
  // так что переключение — это переставленный класс, а не перерисовка. Узлы
  // при этом не исчезают, и `collect()` по-прежнему находит все поля.
  function show(id) {
    active = id;
    for (const node of document.querySelectorAll('[data-tab]')) {
      node.classList.toggle('active', node.dataset.tab === id);
    }
    // Опрос живёт ровно столько, сколько вкладка видна: спрошенный вслепую лог
    // держал бы окно настроек в работе всё время, пока оно открыто.
    clearInterval(logTimer);
    logTimer = null;
    if (id === 'log') {
      refreshLog();
      logTimer = setInterval(refreshLog, 1000);
    }
  }

  function render() {
    document.getElementById('form').innerHTML = GROUPS.map((group) => {
      const note = group.note ? `<p class="note">${escape(group.note)}</p>` : '';
      const fields = group.fields.map(([path, kind, label, about]) => {
        const id = fieldId(path);
        const title = about ? ` title="${escape(about)}"` : '';
        if (kind === 'check') {
          // Пусто в файле значит «включено»: тот же ответ, что даёт parse_config.
          const on = at(file, path) !== false;
          return `<div class="field check"><label for="${id}"${title}>
            <input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${escape(label)}
          </label></div>`;
        }
        const hint = inEffect(path, kind);
        const control = kind === 'lines'
          ? `<textarea id="${id}">${escape(shown(path, kind))}</textarea>`
          : `<input type="${kind === 'password' ? 'password' : 'text'}"
               id="${id}" value="${escape(shown(path, kind))}">`;
        return `<div class="field">
          <label for="${id}"${title}>${escape(label)}</label>
          ${control}
          ${hint ? `<div class="hint">${escape(hint)}</div>` : ''}
        </div>`;
      }).join('');
      return `<section data-tab="${group.id}">
        <h2>${escape(group.title)}</h2>${note}${fields}${group.body || ''}
      </section>`;
    }).join('');
    renderTabs();
    // Классы и опрос лога ставит `show`, а не разметка: иначе перерисовка
    // после Save оставила бы таймер крутиться над узлом, которого уже нет.
    show(active);
  }

  async function load() {
    const out = await invoke('load_settings') || {};
    file = out.file || {};
    effective = out.effective || {};
    render();
  }

  const put = (patch, path, value) => {
    const keys = path.split('.');
    const last = keys.pop();
    keys.reduce((node, key) => (node[key] = node[key] || {}), patch)[last] = value;
  };

  // Собрать патч из тронутого или объяснить, почему собрать нельзя.
  //
  // Возвращает `{ patch }` либо `{ error }`: отказ обязан случиться до записи
  // файла, а не на её половине.
  function collect() {
    const patch = {};
    for (const group of GROUPS) {
      for (const [path, kind, label] of group.fields) {
        const input = document.getElementById(fieldId(path));
        if (kind === 'check') {
          const was = at(file, path) !== false;
          if (input.checked !== was) put(patch, path, input.checked);
          continue;
        }
        const raw = input.value.trim();
        // Пустой пароль не едет в патч вовсе — иначе `Save`, нажатый ради
        // соседнего поля, стирал бы сохранённый пароль каждому, кто открыл
        // форму.
        if (kind === 'password') {
          if (raw) put(patch, path, raw);
          continue;
        }
        const was = at(file, path);
        if (!raw) {
          // Стереть ключ формой нечем: слияние идёт по ключам, а `null`
          // запись отклоняет — она стёрла бы соседний блок целиком. Молча
          // проглоченная очистка соврала бы, что ключ убран.
          if (was != null) {
            return { error: `${label.toLowerCase()}: to remove ${path}, `
              + 'delete the key in config.yaml by hand' };
          }
          continue;
        }
        if (kind === 'number') {
          if (!/^\d+$/.test(raw)) return { error: `${path}: whole number expected` };
          // Порт проверяется по границе, за которой parse_config молча берёт
          // 1883: записанное в файл, но не подхваченное значение хуже отказа —
          // человек видит в форме одно, а брокер получает другое.
          if (path === 'mqtt.port' && (Number(raw) < 1 || Number(raw) > 65535)) {
            return { error: `${path}: 1 to 65535` };
          }
          if (Number(raw) !== was) put(patch, path, Number(raw));
          continue;
        }
        if (kind === 'lines') {
          const list = raw.split('\n').map((s) => s.trim()).filter(Boolean);
          if (JSON.stringify(list) !== JSON.stringify(was || [])) put(patch, path, list);
          continue;
        }
        if (raw !== (was == null ? '' : String(was))) put(patch, path, raw);
      }
    }
    return { patch };
  }

  document.getElementById('tabs').addEventListener('click', (event) => {
    const tab = event.target.closest('.tab');
    if (tab) show(tab.dataset.tab);
  });

  document.getElementById('save').addEventListener('click', async () => {
    const { patch, error } = collect();
    if (error) {
      status.className = 'bad';
      status.textContent = error;
      return;
    }
    if (!Object.keys(patch).length) {
      status.className = '';
      status.textContent = 'nothing changed';
      return;
    }
    try {
      await invoke('save_settings', { patch });
      status.className = '';
      status.textContent = 'saved';
      await load();
    } catch (e) {
      status.className = 'bad';
      status.textContent = String(e);
    }
  });

  await load();
})();
</script>
</body>
</html>
