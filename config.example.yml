# Copy to ~/.config/macos-windows-manager/config.yaml

# Machine where sessions and the ccfzf aggregator live. No default: without it,
# the tracker has nowhere to place its file and no one to ask what the session
# is called. Any form understandable to ssh: a name from ~/.ssh/config,
# user@host, host.domain.
sshHost: remote-host

# Directory of tracker files on that machine. One file per machine where
# terminals are open; the aggregator reads all of them and merges.
remoteDir: ~/.ccfzf/windows

# Name of this machine. The same string is written in `windowHost` of the
# picker's config — by matching these two strings the picker decides whether to
# raise the window.
# Not set — taken from the system.
# windowHost: my-mac

# Bundle id of applications whose windows count as terminals.
terminals:
  - net.kovidgoyal.kitty
  - com.mitchellh.ghostty
  - com.googlecode.iterm2

# Broker through which requests to raise a window and to mark a session unread
# arrive. Without this block the tracker works as before — it lists windows and
# writes its file — but it neither subscribes nor announces that it can raise a
# window.
#
# Both `host` and `base` are needed for the broker to count as configured:
# without the second there is nowhere to subscribe, and guessing someone else's
# prefix is not allowed.
#
# The password lives here rather than arriving from somewhere else: the tray has
# neither a frontend nor command-line arguments, and argv is visible in the
# process list.
# mqtt:
#   host: broker.lan
#   # Default 1883.
#   port: 8883
#   user: picker
#   password: secret
#   # Topic prefix of this machine; the subscription goes to `<base>/#`. It has
#   # to differ between machines: the same base on the Mac and on the Windows
#   # box would collide their subscriptions, and a request addressed to one
#   # would go off to be carried out by the other.
#   #
#   # This is NOT the same value as `mqtt.base` in the picker's config, and
#   # copying one into the other is wrong. There `base` is the bare machine
#   # prefix (say, `home/room/mac`), to which the picker itself appends
#   # `/windows` when addressing the tracker. Here it is the full address with
#   # that tail already on it, taken as is. The picker's value copied unchanged
#   # would subscribe the Mac to someone else's prefix — it would start hearing
#   # requests addressed to the Windows box.
#   base: home/room/mac/windows

# Poll interval in milliseconds when the window is visible.
# tickMs: 1000

# Cache age limit for the session index in milliseconds.
# No need to check the dump on every tick: the title changes on every agent
# response, while the dump already lags. Keep this at least a few times
# larger than tickMs.
# dumpCacheMs: 15000

# Where the tracker keeps its own state on disk: remembered window slots and
# layout snapshots. Not next to this file on purpose — this file you edit by
# hand, those the tracker writes itself, and living side by side would invite
# mixing up a backup of one with the working copy of the other.
# Defaults below, under ~/.local/state/macos-windows-manager/. Overrides here
# are not shell-expanded (no ssh involved, unlike remoteDir above) — write an
# absolute path, not one starting with `~`.
# state:
#   # Remembered window positions, keyed by session id.
#   path: /Users/you/.local/state/macos-windows-manager/state.json
#   # Layout snapshots (see the ^S list on the picker).
#   snapshotsPath: /Users/you/.local/state/macos-windows-manager/snapshots.json
#   # How many snapshots to keep; oldest are dropped past this.
#   keep: 20
#   # How long a changed composition of open sessions must hold before it
#   # becomes a new snapshot, in milliseconds.
#   debounceMs: 60000
